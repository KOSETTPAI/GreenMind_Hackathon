# A11 — approach 11: stack + graphics clock locked at 1305 MHz.
# Alternative to the A02 power cap; compare against the best cap. Must be a
# supported clock (apply-gpu-settings.sh checks) and held for the whole run.
# Long prefills slow directly with clock: watch RAG / long-context TTFT.
source "$(dirname "${BASH_SOURCE[0]}")/_stack.conf"
GPU_CLOCK_MHZ="1305"
compose_extra_args
