# Shared stack for configs/A*.conf: the current winner of each approach in approach/.
# Not a runnable config by itself; launch A00_stack.conf to serve the stack as-is.
#
# Each approach config sources this file, overrides ONE thing, then calls
# compose_extra_args. When a run is decided, write the winning value HERE, so the
# next experiment is measured on top of everything that already won and every
# later config picks it up without editing 30 files.
#
# Starting state = the team's deployment (scripts/start-vllm.sh).

MODEL_ID="CMKL/MANGO1.5-Qwen3.5-9B-AWQ-W4A16-mtp"   # approach 3
# Kept the same in every config, even BF16 ones, so the grader's model dropdown
# and the smoke test's --model never need changing between runs.
SERVED_MODEL_NAME="mango1.5-awq-w4a16"
GPU_MEMORY_UTILIZATION="0.85"   # approach 8
MAX_MODEL_LEN="32768"           # approach 8 (A08a tests 40960)
POWER_LIMIT_W=""                # approach 2  (empty = card default)
GPU_CLOCK_MHZ=""                # approach 11 (empty = not locked)

SPEC_ARGS=()      # approach 4   e.g. (--speculative-config '{"method":"mtp","num_speculative_tokens":1}')
BATCH_ARGS=()     # approach 5   e.g. (--max-num-seqs 128)
PREFILL_ARGS=()   # approach 6   e.g. (--enable-chunked-prefill --max-num-batched-tokens 4096)
PREFIX_ARGS=()    # approach 7   e.g. (--enable-prefix-caching --mamba-cache-mode align)
QUANT_ARGS=()     # approach 3b  e.g. (--quantization fp8) with the BF16 MODEL_ID
STATE_ARGS=()     # approach 9   e.g. (--mamba-ssm-cache-dtype bfloat16)
KV_ARGS=()        # approach 13  e.g. (--kv-cache-dtype fp8)
SERVER_ARGS=()    # approach 12  e.g. (--api-server-count 2)

compose_extra_args() {
  EXTRA_ARGS=(
    ${QUANT_ARGS[@]+"${QUANT_ARGS[@]}"}
    ${SPEC_ARGS[@]+"${SPEC_ARGS[@]}"}
    ${BATCH_ARGS[@]+"${BATCH_ARGS[@]}"}
    ${PREFILL_ARGS[@]+"${PREFILL_ARGS[@]}"}
    ${PREFIX_ARGS[@]+"${PREFIX_ARGS[@]}"}
    ${STATE_ARGS[@]+"${STATE_ARGS[@]}"}
    ${KV_ARGS[@]+"${KV_ARGS[@]}"}
    ${SERVER_ARGS[@]+"${SERVER_ARGS[@]}"}
  )
}
