# A06 — approach 6: stack + chunked prefill with a 4096-token step budget.
# Smaller budget: steadier TPOT, slower long-prompt TTFT. Compare TTFT p95
# normalized by each request's own SLO, and TPOT p95, together.
source "$(dirname "${BASH_SOURCE[0]}")/_stack.conf"
PREFILL_ARGS=(--enable-chunked-prefill --max-num-batched-tokens 4096)
compose_extra_args
