# T2 — T1 + stream interval 4.
# The API server sends streamed tokens in groups of 4 instead of one SSE event per
# token, cutting per-token detokenize/serialize/HTTP work at ~200 concurrent streams.
# Mean TPOT is unchanged by definition; check TTFT on the smoke test (the first
# token must still arrive immediately). Drop T2 if the flag is missing.
EXTRA_ARGS=(--async-scheduling --stream-interval 4)
