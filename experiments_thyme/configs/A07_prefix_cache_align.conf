# A07 — approach 7: stack + prefix caching in hybrid (align) mode.
# Off by default for hybrid models. Check the startup log says it is ENABLED and
# that prefix-cache hits rise on the 2-turn tool test before using a Validation run.
source "$(dirname "${BASH_SOURCE[0]}")/_stack.conf"
PREFIX_ARGS=(--enable-prefix-caching --mamba-cache-mode align)
compose_extra_args
