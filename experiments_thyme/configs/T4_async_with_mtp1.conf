# T4 — compatibility check: async scheduling together with MTP (approach 4).
# Some vLLM versions refuse async scheduling with speculative decoding. If this
# config fails at startup, the team must choose MTP or async scheduling by
# measurement (compare approach 4's best MTP run against T1 on the same base).
EXTRA_ARGS=(--async-scheduling
  --speculative-config '{"method":"mtp","num_speculative_tokens":1}')
