# T1 — T0 + async scheduling.
# The engine core prepares step N+1 (scheduling, input prep, sampling bookkeeping)
# while the GPU runs step N, instead of the GPU waiting for the CPU between steps.
# If preflight shows async scheduling is already the default in this image, T1 is
# a no-op: instead re-run T0 with EXTRA_ARGS=(--no-async-scheduling) to measure it.
EXTRA_ARGS=(--async-scheduling)
