# T3 — best of T1/T2 + CUDA graphs covering the peak batch size.
# Run ONLY if telemetry shows peak num_requests_running above the largest captured
# CUDA graph size printed in the startup log; batches above that size run without
# full graphs and pay kernel-launch overhead on every decode step.
# Edit the async/stream flags below to match whichever of T1/T2 won.
EXTRA_ARGS=(--async-scheduling --stream-interval 4
  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":512}')
