# A08c — approach 8: stack + gpu-memory-utilization 0.92.
# More KV/state cache → more concurrent sequences, fewer preemptions. Too high →
# out-of-memory mid-run, which fails the whole submission: confirm on a full Validation run.
source "$(dirname "${BASH_SOURCE[0]}")/_stack.conf"
GPU_MEMORY_UTILIZATION="0.92"
compose_extra_args
