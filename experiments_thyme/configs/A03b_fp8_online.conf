# A03b — approach 3 fallback: BF16 checkpoint quantized to FP8 weight-only at load.
# A100 has no FP8 math, so vLLM uses W8A16 (Marlin) kernels: half the weight bytes
# of BF16, less accuracy risk than 4-bit. Use if AWQ fails the per-class check.
# Derived weights are made at load from the official checkpoint (allowed; disclose).
source "$(dirname "${BASH_SOURCE[0]}")/_stack.conf"
MODEL_ID="CMKL/MANGO1.5-Qwen3.5-9B"
SPEC_ARGS=()
QUANT_ARGS=(--quantization fp8)
compose_extra_args
